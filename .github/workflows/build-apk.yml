name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test scan engine
        run: ./gradlew :core:test --no-daemon
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kavach.apk
      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Kavach-APK
          path: Kavach.apk
      # Publishes the APK as a direct download on the repository's Releases page (easy to open on a phone).
      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kavach (latest build)
          body: |
            Download **Kavach.apk** below and open it on your Android phone.
            Allow "Install unknown apps" for your browser or file manager when Android asks.
            Built from commit ${{ github.sha }}.
          files: Kavach.apk
          make_latest: true
